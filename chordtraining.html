<title>Chord Quiz: Button Style</title>
<h1>Button Style Chord Training</h1>

<p>Current score: <text id="insertScore"></text></p>
<p>Select the correct chord type:</p>
<button onclick="playAgain()">Click to hear again</button><br><br>

<input type="button" onclick="submit(this.id)" id="33" value="Dim" />
<input type="button" onclick="submit(this.id)" id="34" value="Min" /> 
<input type="button" onclick="submit(this.id)" id="43" value="Maj" />
<input type="button" onclick="submit(this.id)" id="44" value="Aug" />

<p id="insertAnswer"></p>
<!-- <button onclick="submit()">Submit</button><br><br> -->
<div id="nextButton"><button onclick="next()">Next</button></div>

<script>
  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4 *NOTE THE SPELLINGGGGGGGGGGGGGG 😎
  var intervalA = getRndInteger(3, 4 + 1);
  var intervalB = getRndInteger(3, 4 + 1)
  var answer = "" + intervalA + intervalB;
  var delay = 0.05; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;

  window.onload = function () {
    MIDI.loadPlugin({
      soundfontUrl: "./soundfont/",
      instrument: "acoustic_grand_piano",
      onprogress: function(state, progress) {
        console.log(state, progress);
      },
      onsuccess: function() {
        MIDI.chordOn(0, [noteBass, noteBass+intervalA, noteBass+intervalA+intervalB], velocity, delay);
        MIDI.chordOff(0, [noteBass, noteBass+intervalA, noteBass+intervalA+intervalB], delay + 1.5);
      }
    });
  };

  function getRndInteger(min, max) {
    return Math.floor(Math.random() * (max - min)) + min;
  }

  function submit(clicked_id) {
    // if ($(#answer).attr('checked')) {
    if (clicked_id == answer) {
      $("#insertAnswer").html("Correct!");
      // document.getElementById("insertAnswer").innerHTML = "Correct!";        
      $("#nextButton").show(); 
      score++;
      $("#insertScore").html(score);
      } else {
      $("#insertAnswer").html("Try again.")
      // document.getElementById("insertAnswer").innerHTML = "Try again.";
      $("#nextButton").hide(); 
    }
  }

  function next() {
    noteBass = getRndInteger(startRange, endRange + 1);
    intervalA = getRndInteger(3, 4 + 1);
    intervalB = getRndInteger(3, 4 + 1)
    answer = "" + intervalA + intervalB;

    MIDI.chordOn(0, [noteBass, noteBass+intervalA, noteBass+intervalA+intervalB], velocity, delay);
    MIDI.chordOff(0, [noteBass, noteBass+intervalA, noteBass+intervalA+intervalB], delay + 1.5);
    $("#insertAnswer").html("");
    // document.getElementById("insertAnswer").innerHTML = "";
  }

  function playAgain() {
    MIDI.chordOn(0, [noteBass, noteBass+intervalA, noteBass+intervalA+intervalB], velocity, delay);
    MIDI.chordOff(0, [noteBass, noteBass+intervalA, noteBass+intervalA+intervalB], delay + 1.5);
  }

  $(document).ready(function(){
    $("#nextButton").hide();
    $("#nextButton").click(function(){
      $("#nextButton").hide(); 
    });
  });

</script>

</body>
</html>
