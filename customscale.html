
<!DOCTYPE html>
<html>
<body>

<head>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <!-- polyfill -->
  <script src="/inc/shim/Base64.js" type="text/javascript"></script>
  <script src="/inc/shim/Base64binary.js" type="text/javascript"></script>
  <script src="/inc/shim/WebAudioAPI.js" type="text/javascript"></script>
  <!-- midi.js package -->
  <script src="/js/midi/audioDetect.js" type="text/javascript"></script>
  <script src="/js/midi/gm.js" type="text/javascript"></script>
  <script src="/js/midi/loader.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.audiotag.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webaudio.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webmidi.js" type="text/javascript"></script>
  <!-- utils -->
  <script src="/js/util/dom_request_xhr.js" type="text/javascript"></script>
  <script src="/js/util/dom_request_script.js" type="text/javascript"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<title>Customizable Scale Training</title>
<h1>Customizable Scale Training</h1>

<p>Current score: <text id="insertScore"></text></p>
<button onclick="playAgain()">Click to hear scale</button>
<p>A new scale will be generated when you click on a checkbox.</p>

<input class="ansChoice" type="button" onclick="submit(this.id)" id="0" value="Major (Ionian)" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="1" value="Natural Minor (Aeolian)" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="2" value="Harmonic Minor" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="3" value="Melodic Minor" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="4" value="Dorian" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="5" value="Phrygian" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="6" value="Lydian" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="7" value="Mixolydian" />


<input class="checkbox" type="checkbox" onclick="check(this.id)" id="0" name="=Major (Ionian)"/>
<label for="Major (Ionian)">Major (Ionian)</label><br>
<input class="checkbox" type="checkbox" onclick="check(this.id)" id="1" name="Natural Minor (Aeolian)"/>
<label for="Natural Minor (Aeolian)">Natural Minor (Aeolian)</label><br>
<input class="checkbox" type="checkbox" onclick="check(this.id)" id="2" name="Harmonic Minor"/>
<label for="Harmonic Minor">Harmonic Minor</label><br>
<input class="checkbox" type="checkbox" onclick="check(this.id)" id="3" name="Melodic Minor"/>
<label for="Melodic Minor">Melodic Minor</label><br>
<input class="checkbox" type="checkbox" onclick="check(this.id)" id="4" name="Dorian"/>
<label for="Dorian">Dorian</label><br>
<input class="checkbox" type="checkbox" onclick="check(this.id)" id="5" name="Phrygian"/>
<label for="Phrygian">Phrygian</label><br>
<input class="checkbox" type="checkbox" onclick="check(this.id)" id="6" name="Lydian"/>
<label for="Lydian">Lydian</label><br>
<input class="checkbox" type="checkbox" onclick="check(this.id)" id="7" name="Mixolydian"/>
<label for="Mixolydian">Mixolydian</label><br>


<div id="nextButton"><button onclick="next()">Next</button></div>

<script src="base.js"></script>

<script>
  var playDuration = 0.75;
  var prevNoteBass;
  var chords = [
  [0, 2, 4, 5, 7, 9, 11, 12, 11, 9, 7, 5, 4, 2, 0], // Maj
  [0, 2, 3, 5, 7, 8, 10, 12, 10, 8, 7, 5, 3, 2, 0], // Nat min
  [0, 2, 3, 5, 7, 8, 11, 12, 11, 8, 7, 5, 3, 2, 0],  // Harm min
  [0, 2, 3, 5, 7, 9, 11, 12, 10, 8, 7, 5, 3, 2, 0], // Mel min
  [0, 2, 3, 5, 7, 9, 10, 12, 10, 9, 7, 5, 3, 2, 0],  // Dorian
  [0, 1, 3, 5, 7, 8, 10, 12, 10, 8, 7, 5, 3, 1, 0], // Phrygian
   [0, 2, 4, 6, 7, 9, 11, 12, 11, 9, 7, 6, 4, 2, 0], // Lydian
  [0, 2, 4, 5, 7, 9, 10, 12, 10, 9, 7, 5, 4, 2, 0]  // Mixolydian
  ];

  var checkbox = [false,false,false,false,false,
  false,false,false];

  var chord;
  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4
  var answer = getRndChord(checkbox);
  var delay = 0.05; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;var total = 0;var firstTime = true;

  window.onload = function () {
    $("#nextButton").hide();
    $(".ansChoice").hide();
    console.log("its hiding cuz it loaded");
    MIDI.loadPlugin({
      soundfontUrl: "./soundfont/",
      instrument: "acoustic_grand_piano",
      onprogress: function(state, progress) {
        console.log(state, progress);
      },
    });
  };

  function getRndChord(checkbox) {
    var numTrue = 0;
    for (var i = 0; i < checkbox.length; i++)
      if (checkbox[i])
        numTrue++;

    if (numTrue == 0)
      return getRndInteger(0, checkbox.length);

    var rand = Math.floor(Math.random() * numTrue);
    for (var i = 0; i < checkbox.length; i++) {
      if (checkbox[i]) {
        if (rand == 0) {
          return i;
        }
        rand--;
      }
    }
    return getRndInteger(0, checkbox.length);
  }

  function submit(clicked_id) {
    if (clicked_id == answer) {
      $("#nextButton").show();
      $("#nextButton").show();if (firstTime == true) {score++;total++;}firstTime = true;$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");

      $("body").find('#' + clicked_id).addClass("rightButton");
      $(".ansChoice").prop('disabled', true);
      MIDI.stopAllNotes();
      } else {
      $("#nextButton").hide();
      $("body").find('#' + clicked_id).addClass("wrongButton");
      $("body").find('#' + clicked_id).prop('disabled', true);if (firstTime == true) {total++;firstTime = false;}$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
    }
  }

  function check(id) {
    checkbox[id] = !checkbox[id];
    if (checkbox[id])
      $("body").find('#' + id).show();
    else
      $("body").find('#' + id).hide();
    nextNoPlay();
  }

  function next() {
    MIDI.stopAllNotes();
    $("#nextButton").hide();

    noteBass = getRndInteger(startRange, endRange + 1, prevNoteBass); //C4-B4 //UPDATE!
    prevNoteBass = noteBass;

    answer = getRndChord(checkbox);
    setTimeout(function() {playAgain() }, 1000);
    $(".ansChoice").removeClass("wrongButton");
    $(".ansChoice").removeClass("rightButton");
    $(".ansChoice").prop('disabled', false);
  }

  function nextNoPlay() {
    MIDI.stopAllNotes();
    $("#nextButton").hide();

    noteBass = getRndInteger(startRange, endRange + 1, prevNoteBass); //C4-B4 //UPDATE!
    prevNoteBass = noteBass;

    answer = getRndChord(checkbox);
    $(".ansChoice").removeClass("wrongButton");
    $(".ansChoice").removeClass("rightButton");
    $(".ansChoice").prop('disabled', false);
  }

  function playAgain() {
    MIDI.stopAllNotes();
    var i = 0;
    var timeCount = 0;
    for (var i = 0; i < chords[answer].length; i++) {
      MIDI.noteOn(0, noteBass + chords[answer][i], velocity, delay + playDuration * timeCount);
      MIDI.noteOff(0, noteBass + chords[answer][i], delay + playDuration * (timeCount + 1));
      timeCount++;
    }
  }

</script>

</body>
</html>
