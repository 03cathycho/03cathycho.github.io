<title>Scale: Day 6</title>
<h1>Scale: Day 6</h1>

</div>
<div style="margin: 0 auto; max-width: 50em;">

<p>Current score: <text id="insertScore"></text></p>
<button class="btn btn-primary btn-sm" onclick="playAgain()">Click to hear scale</button><br><br>

<div class="container-fluid">
  <div class="row">
    <input class="btn btn-light col-sm-4 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="0" value="Major (Ionian)" />
    <input class="btn btn-light col-sm-4 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="1" value="Lydian" />
  </div>
    <input class="btn btn-light col-sm-4 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="2" value="Mixolydian" />
</div>

<p></p>

<div id="nextButton"><button class="btn btn-primary btn-sm" onclick="next()">Next</button></div>

<script src="base.js"></script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>

<script>
  var scales = [
  [0, 2, 4, 5, 7, 9, 11, 12, 11, 9, 7, 5, 4, 2, 0], // Maj
  [0, 2, 4, 6, 7, 9, 11, 12, 11, 9, 7, 6, 4, 2, 0], // Lydian
  [0, 2, 4, 5, 7, 9, 10, 12, 10, 9, 7, 5, 4, 2, 0]  // Mixolydian
  ];
  var prevNoteBass; 

  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4 *NOTE THE SPELLINGGGGGGGGGGGGGG 😎
  var answer = getRndInteger(0, scales.length); //1 = major, 2 = natural minor, 3 = harmonic minor, 4 = melodic minor

  var delay = 0.05; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;var total = 0;var firstTime = true;
  var playDuration = 0.75;

  function submit(clicked_id) {
    if (clicked_id == answer) {   
      $("#nextButton").show(); 
      $("#nextButton").show();if (firstTime == true) {score++;total++;}firstTime = true;$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
      
      $("body").find('#' + clicked_id).addClass("rightButton");
      $(".ansChoice").prop('disabled', true);
      MIDI.stopAllNotes();
      } else {
      $("#nextButton").hide(); 
      $("body").find('#' + clicked_id).addClass("wrongButton");
      $("body").find('#' + clicked_id).prop('disabled', true);if (firstTime == true) {total++;firstTime = false;}$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
    }
  }

  function next() {
    MIDI.stopAllNotes();
    $("#nextButton").hide();

    noteBass = getRndInteger(startRange, endRange + 1, prevNoteBass); //C4-B4 //UPDATE!
    prevNoteBass = noteBass;
    
    answer = getRndInteger(0, scales.length);
    setTimeout(function() {playAgain() }, 1000); 
    $(".ansChoice").removeClass("wrongButton");
    $(".ansChoice").removeClass("rightButton");
    $(".ansChoice").prop('disabled', false);
  }

  function playAgain() {
    MIDI.stopAllNotes();
    var i = 0;
    var timeCount = 0;
    for (var i = 0; i < scales[answer].length; i++) {
      MIDI.noteOn(0, noteBass + scales[answer][i], velocity, delay + playDuration * timeCount);
      MIDI.noteOff(0, noteBass + scales[answer][i], delay + playDuration * (timeCount + 1));
      timeCount++;
    }
  }
</script>
