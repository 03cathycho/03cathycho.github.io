<!DOCTYPE html>
<html>
<body>

<head>

  <!-- polyfill -->

  <!-- midi.js package -->
  <script src="/js/midi/audioDetect.js" type="text/javascript"></script>
  <script src="/js/midi/gm.js" type="text/javascript"></script>
  <script src="/js/midi/loader.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.audiotag.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webaudio.js" type="text/javascript"></script>

  <!-- utils -->

<title>Triad Chord Training with Inversions</title>
<h1>Triad Chord Training with Inversions</h1>

<p>Current score: <text id="insertScore"></text></p>
<button onclick="playAgain()">Click to hear chord</button><br><br>

<input class="ansChoice" type="button" onclick="submit(this.id)" id="0" value="Major Triad" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="1" value="Major Triad, first inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="2" value="Major Triad, second inversion" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="3" value="Minor Triad" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="4" value="Minor Triad, first inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="5" value="Minor Triad, second inversion" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="6" value="Diminished Triad" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="7" value="Diminished Triad, first inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="8" value="Diminished Triad, second inversion" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="9" value="Augmented Triad" /><br>

<p></p>
<div id="nextButton"><button onclick="next()">Next</button></div>

<script src="base.js"></script>

<script>
  var chords = [
  [0, 4, 7], // Maj
  [0, 3, 8], // inv1
  [0, 5, 9], // inv2
  [0, 3, 7], // Min
  [0, 4, 9], // inv1
  [0, 5, 8], // inv2
  [0, 3, 6], // Dim
  [0, 3, 9], // inv1
  [0, 6, 9], // inv2
  [0, 4, 8], //Aug
  [0, 4, 8], //Aug
  [0, 4, 8] //Aug
  ];

  var chord = [0, 0, 0];
  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4 *NOTE THE SPELLINGGGGGGGGGGGGGG 😎
  var answer = getRndInteger(0, chords.length);
  var delay = 0.05; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;var total = 0;var firstTime = true;

  function submit(clicked_id) {
    if (clicked_id == answer || (clicked_id == 9 && (answer == 10 || answer == 11))) {
      $("#nextButton").show();
      $("#nextButton").show();if (firstTime == true) {score++;total++;}firstTime = true;$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
      
      $("body").find('#' + clicked_id).addClass("rightButton");
      $(".ansChoice").prop('disabled', true);
      } else {
      $("#nextButton").hide();
      $("body").find('#' + clicked_id).addClass("wrongButton");
      $("body").find('#' + clicked_id).prop('disabled', true);if (firstTime == true) {total++;firstTime = false;}$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
    }
  }

  function next() {
    $("#nextButton").hide(); 
3    noteBass = getRndInteger(startRange, endRange + 1); //C4-B4
    answer = getRndInteger(0, chords.length - 1);
    setTimeout(function() {playAgain() }, 1000);
    $(".ansChoice").removeClass("wrongButton");
    $(".ansChoice").removeClass("rightButton");
    $(".ansChoice").prop('disabled', false);
  }

  function playAgain() {
    chord = chords[answer].slice();
    for (var i = 0; i < chord.length; i++) {
      chord[i] += noteBass;
    }
    MIDI.chordOn(0, chord, velocity, delay);
    MIDI.chordOff(0, chord, delay + 1.5);
  }
</script>

</body>
</html>
