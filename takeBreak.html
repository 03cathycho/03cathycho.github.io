<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
	
	<link rel="stylesheet" href="styles.css">
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<link href="//db.onlinewebfonts.com/c/98f5fe0ce4808213a131b58dfc8dfea3?family=Grouch+BT" rel="stylesheet" type="text/css"/>
</head>

<body>	
	<header class="sticky-top">
	<div id="nav-placeholder"></div>
	<script>
	$(function(){
	  $("#nav-placeholder").load("/navigation.html");
	});
	</script>
	</header>

	<div class="container-fluid" align="center">
		<br>
		<title>Take a break!</title>
		<br>
		<h1>Take a break!</h1>
		<p>Here, take a look at a dog:</p>
		<button align="center" class="btn btn-primary" onclick="choosePic()">Click to see another dog</button><br><br>
		<img class="box-break" id="myPicture" alt="some image">
	</div>



<script>
	var previousNum;
	
	window.onload = choosePic;

	var myPix = new Array(
		"/images/dog1.jpg",
		"/images/dog2.jpg",
		"/images/dog3.jpg",
		"/images/dog4.jpg",
		// "/images/dog5.jpg", image is broken
		"/images/dog6.jpg",
		"/images/dog7.jpg",
		"/images/dog8.jpg",
		"/images/dog9.jpg",
		// "/images/dog10.jpg"
		// "/images/dog11.jpg",
		// "/images/dog12.jpg",
		// "/images/dog13.jpg",
		// "/images/dog14.jpg",
		// "/images/dog15.jpg",
		// "/images/dog16.jpg",
		// "/images/dog17.jpg",
		// "/images/dog18.jpg"
		);

	function choosePic() {
		console.log("clicked");
	     var randomNum = Math.floor(Math.random() * myPix.length);
	     while (randomNum == previousNum) {
	     	randomNum = Math.floor(Math.random() * myPix.length);
	     }
	     previousNum = randomNum;
	     document.getElementById("myPicture").src = myPix[randomNum];
	}

</script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>

</body>
</html>
