<!DOCTYPE html>
<html>
<body>

<head>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <!-- polyfill -->
  <script src="/inc/shim/Base64.js" type="text/javascript"></script>
  <script src="/inc/shim/Base64binary.js" type="text/javascript"></script>
  <script src="/inc/shim/WebAudioAPI.js" type="text/javascript"></script>
  <!-- midi.js package -->
  <script src="/js/midi/audioDetect.js" type="text/javascript"></script>
  <script src="/js/midi/gm.js" type="text/javascript"></script>
  <script src="/js/midi/loader.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.audiotag.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webaudio.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webmidi.js" type="text/javascript"></script>
  <!-- utils -->
  <script src="/js/util/dom_request_xhr.js" type="text/javascript"></script>
  <script src="/js/util/dom_request_script.js" type="text/javascript"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<title>Seventh Chord Training with Inversions</title>
<h1>Seventh Chord Training with Inversions</h1>

<p>Current score: <text id="insertScore"></text></p>
<button onclick="playAgain()">Click to hear chord</button><br><br>

<input class="ansChoice" type="button" onclick="submit(this.id)" id="0" value="Major 7th" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="1" value="Major 7th, first inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="2" value="Major 7th, second inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="3" value="Major 7th, third inversion" /> <br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="4" value="Dominant 7th" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="5" value="Dominant 7th, first inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="6" value="Dominant 7th, second inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="7" value="Dominant 7th, third inversion" /> <br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="8" value="Minor 7th" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="9" value="Minor 7th, first inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="10" value="Minor 7th, second inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="11" value="Minor 7th, third inversion" /> <br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="12" value="Half-Diminished 7th" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="13" value="Half-Diminished 7th, first inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="14" value="Half-Diminished 7th, second inversion" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="15" value="Half-Diminished 7th, third inversion" /> <br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="16" value="Full-Diminished 7th" /> <br>

<div id="nextButton"><button onclick="next()">Next</button></div>

<script src="base.js"></script>

<script>
  var prevNoteBass; 
  var chords = [
  [0,4,7,11], // Maj 7
  [0,3,7,8], // inv1
  [0,4,5,9], // inv2
  [0,1,5,8], // inv3
  [0,4,7,10], // D7
  [0,3,6,8], // inv1
  [0,3,5,9], // inv2
  [0,2,6,9], // inv3
  [0,3,7,10], // m7
  [0,4,7,9], // inv1
  [0,3,5,8], // inv2
  [0,2,5,9], // inv3
  [0,3,6,10], // ø half-dim7
  [0,3,7,9], // inv1
  [0,4,6,9], // inv2
  [0,2,5,8], // inv3
  [0,3,6,9], // dim7
  [0,3,6,9], // dim7
  [0,3,6,9], // dim7
  [0,3,6,9] // dim7
  ];
  var chord = [0, 0, 0, 0];
  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4 *NOTE THE SPELLINGGGGGGGGGGGGGG 😎
  var answer = getRndInteger(0, chords.length);
  var delay = 0.05; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;var total = 0;var firstTime = true;

  function submit(clicked_id) {
    if (clicked_id == answer || (clicked_id == 16 && (answer == 17 || answer == 18 || answer == 19))) {
      $("#nextButton").show();
      $("#nextButton").show();if (firstTime == true) {score++;total++;}firstTime = true;$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
      
      $("body").find('#' + clicked_id).addClass("rightButton");
      $(".ansChoice").prop('disabled', true);
      MIDI.stopAllNotes();
      } else {
      $("#nextButton").hide();
      $("body").find('#' + clicked_id).addClass("wrongButton");
      $("body").find('#' + clicked_id).prop('disabled', true);if (firstTime == true) {total++;firstTime = false;}$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
    }
  }

  function next() {
    MIDI.stopAllNotes();
    $("#nextButton").hide();

    noteBass = getRndInteger(startRange, endRange + 1, prevNoteBass); //C4-B4 //UPDATE!
    prevNoteBass = noteBass;
    
    answer = getRndInteger(0, chords.length);
    setTimeout(function() {playAgain() }, 1000);
    $(".ansChoice").removeClass("wrongButton");
    $(".ansChoice").removeClass("rightButton");
    $(".ansChoice").prop('disabled', false);
  }

  function playAgain() {
    MIDI.stopAllNotes();
    chord = chords[answer].slice();
    for (var i = 0; i < chord.length; i++) {
      chord[i] += noteBass;
    }
    MIDI.chordOn(0, chord, velocity, delay);
    MIDI.chordOff(0, chord, delay + 1.5);
  }
</script>

</body>
</html>
