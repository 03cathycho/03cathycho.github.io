<!DOCTYPE html>
<html>
<body>

<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <!-- polyfill -->
  <script src="/inc/shim/Base64.js" type="text/javascript"></script>
  <script src="/inc/shim/Base64binary.js" type="text/javascript"></script>
  <script src="/inc/shim/WebAudioAPI.js" type="text/javascript"></script>
  <!-- midi.js package -->
  <script src="/js/midi/audioDetect.js" type="text/javascript"></script>
  <script src="/js/midi/gm.js" type="text/javascript"></script>
  <script src="/js/midi/loader.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.audiotag.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webaudio.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webmidi.js" type="text/javascript"></script>
  <!-- utils -->
  <script src="/js/util/dom_request_xhr.js" type="text/javascript"></script>
  <script src="/js/util/dom_request_script.js" type="text/javascript"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<title>Math Quiz: Radio Button Style</title>
<h1>Semi-working version</h1>
<p>Not really radio button if it allows simulatanous answer selection..</p>

<p id="message"><text id="insertQuestion"></text>?</p>

<!--connect radio buttons-->
<input type="radio" id="1" />1<br>
<input type="radio" id="2" />2<br>
<input type="radio" id="3" />3<br>
<input type="radio" id="4" />4<br>
<input type="radio" id="5" />5<br>
<input type="radio" id="6" />6<br>
<input type="radio" id="7" />7<br>
<input type="radio" id="8" />8<br>
<input type="radio" id="9" />9<br>

<p id="insertAnswer"></p>
<button onclick="submit()">Submit</button>
<div id="nextButton"><button onclick="next()">Next</button></div>

<script>
  var question = numA + " + " + numB;
  var  numA = Math.floor(Math.random() * 9 + 1); //create getRdmInt function
  var numB = Math.floor(Math.random() * (9 - numA));
  var answer = numA + numB;

  document.getElementById("insertQuestion").innerHTML = numA + " + " + numB;

  window.onload = function () {
    MIDI.loadPlugin({
      soundfontUrl: "./soundfont/",
      instrument: "acoustic_grand_piano",
      onprogress: function(state, progress) {
        console.log(state, progress);
      },
      onsuccess: function() {
        var delay = 0; // play one note every quarter second
        // var note = 50; // the MIDI note
        var velocity = 127; // how hard the note hits
        // play the note
        MIDI.setVolume(0, 127);
        // MIDI.noteOn(0, note, velocity, delay);
        // MIDI.noteOff(0, note, delay + 0.75);
        MIDI.chordOn(0, [50, 51 + Math.floor(Math.random() * 5)], velocity, delay);
      }
    });
  };

  function submit() {
      MIDI.chordOn(0, [50, 51 + Math.floor(Math.random() * 5)], 127, 0);
      if (document.getElementById(answer).checked) {
        document.getElementById("insertAnswer").innerHTML = "Correct!";
        $("#nextButton").show(); 
      } else {
        document.getElementById("insertAnswer").innerHTML = "Try again.";
        $("#nextButton").hide(); 
        // document.getElementById(answer).checked = false;
      }
    }

  function next() {
    numA = Math.floor(Math.random() * 9 + 1);
    numB = Math.floor(Math.random() * (9 - numA));
    answer = numA + numB;
    $("#insertQuestion").html(numA + " + " + numB); //instead of document.get...
    // document.getElementById("nextButton").innerHTML = "";
    document.getElementById("insertAnswer").innerHTML = "";
  }

  $(document).ready(function(){
    $("#nextButton").hide(); 
    $("#nextButton").click(function(){
      $("#nextButton").hide(); 
    });
  });

</script>

</body>
</html>
