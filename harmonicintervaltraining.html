<div class="container-fluid">
<div align="center">

<title>Harmonic Interval Training</title>
<h1>Harmonic Interval Training</h1>


</div>
<div style="margin: 0 auto; max-width: 50em;">

<p>Current score: <text id="insertScore"></text></p>
<button class="btn btn-primary btn-sm" onclick="playAgain()">Click to hear interval</button><br><br>

<div class="container-fluid">
  <div class="row">
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="1" value="m2" />
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="2" value="M2" />
  </div>
</div>

<div class="container-fluid">
  <div class="row">
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="3" value="m3" />
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="4" value="M3" />
  </div>
</div>

<div class="container-fluid">
  <div class="row">
    <input class="btn btn-light col-sm-4 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="5" value="P4" />
    <input class="btn btn-light col-sm-4 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="6" value="TT" />
    <input class="btn btn-light col-sm-4 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="7" value="P5" />
  </div>
</div>

<div class="container-fluid">
  <div class="row">
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="8" value="m6" />
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="9" value="M6" /><br>
  </div>
</div>

<div class="container-fluid">
  <div class="row">
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="10" value="m7" />
    <input class="btn btn-light col-sm-6 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="11" value="M7" />
  </div>
</div>

<div class="container-fluid">
  <div class="row">
    <input class="btn btn-light col-sm-12 text-wrap ansChoice" type="button" onclick="submit(this.id)" id="12" value="P8" />
  </div>
</div>

<p></p>
<div id="nextButton"><button class="btn btn-primary btn-sm" onclick="next()">Next</button></div>

<script src="base.js"></script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>

<script>
  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4 *NOTE THE SPELLINGGGGGGGGGGGGGG 😎
  var answer = getRndInteger(1, 12 + 1); 
  var delay = 0.05; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;var total = 0;var firstTime = true;
  var prevNoteBass; 

  function submit(clicked_id) {
    if (clicked_id == answer) {   
      $("#nextButton").show(); 
      $("#nextButton").show();if (firstTime == true) {score++;total++;}firstTime = true;$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
      
      $("body").find('#' + clicked_id).addClass("rightButton");
      $(".ansChoice").prop('disabled', true);
      } else {
      $("#nextButton").hide(); 
      $("body").find('#' + clicked_id).addClass("wrongButton");
      $("body").find('#' + clicked_id).prop('disabled', true);if (firstTime == true) {total++;firstTime = false;}$("#insertScore").html(score + "/" + total + ", Percent correct: " + Math.round(100.0 * score / total) + "%");
    }
  }

  function next() {
    $("#nextButton").hide();

    noteBass = getRndInteger(startRange, endRange + 1, prevNoteBass); //C4-B4 //UPDATE!
    prevNoteBass = noteBass;
    answer = getRndInteger(1, 12 + 1);
    setTimeout(function() {playAgain() }, 1000);
    $(".ansChoice").removeClass("wrongButton");
    $(".ansChoice").removeClass("rightButton");
    $(".ansChoice").prop('disabled', false);
  }

  function playAgain() {
    MIDI.chordOn(0, [noteBass, noteBass + answer], velocity, delay);
    MIDI.chordOff(0, [noteBass, noteBass + answer], delay + 1.5);
  }
</script>

</body>
</html>
