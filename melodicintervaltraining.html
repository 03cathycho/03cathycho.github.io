<!-- 
Harmonic interval training with buttons, not radio buttons
-->

<!DOCTYPE html>
<html>
<body>

<head>
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <!-- polyfill -->
  <script src="/inc/shim/Base64.js" type="text/javascript"></script>
  <script src="/inc/shim/Base64binary.js" type="text/javascript"></script>
  <script src="/inc/shim/WebAudioAPI.js" type="text/javascript"></script>
  <!-- midi.js package -->
  <script src="/js/midi/audioDetect.js" type="text/javascript"></script>
  <script src="/js/midi/gm.js" type="text/javascript"></script>
  <script src="/js/midi/loader.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.audiotag.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webaudio.js" type="text/javascript"></script>
  <script src="/js/midi/plugin.webmidi.js" type="text/javascript"></script>
  <!-- utils -->
  <script src="/js/util/dom_request_xhr.js" type="text/javascript"></script>
  <script src="/js/util/dom_request_script.js" type="text/javascript"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<title>Melodic Interval Quiz: Button Style</title>
<h1>Button Style Melodic Interval Training</h1>

<p>Current score: <text id="insertScore"></text></p>
<p>Select the correct interval:</p>
<button onclick="playAgain()">Click to hear again</button><br><br>


<input type="button" onclick="submit(this.id)" id="1" value="m2" />
<input type="button" onclick="submit(this.id)" id="2" value="M2" /><br>
<input type="button" onclick="submit(this.id)" id="3" value="m3" />
<input type="button" onclick="submit(this.id)" id="4" value="M3" /><br>
<input type="button" onclick="submit(this.id)" id="5" value="P4" />
<input type="button" onclick="submit(this.id)" id="6" value="TT" />
<input type="button" onclick="submit(this.id)" id="7" value="P5" /><br>
<input type="button" onclick="submit(this.id)" id="8" value="m6" />
<input type="button" onclick="submit(this.id)" id="9" value="M6" /><br>
<input type="button" onclick="submit(this.id)" id="10" value="m7" />
<input type="button" onclick="submit(this.id)" id="11" value="M7" /><br>
<input type="button" onclick="submit(this.id)" id="12" value="P8" />

<!-- RADIO BUTTON STYLE
<input name="option" type="radio" id="1" />m2<br>
<input name="option" type="radio" id="2" />M2<br>
<input name="option" type="radio" id="3" />m3<br>
<input name="option" type="radio" id="4" />M3<br>
<input name="option" type="radio" id="5" />P4<br>
<input name="option" type="radio" id="6" />TT<br>
<input name="option" type="radio" id="7" />P5<br>
<input name="option" type="radio" id="8" />m6<br>
<input name="option" type="radio" id="9" />M6<br>
<input name="option" type="radio" id="10" />m7<br>
<input name="option" type="radio" id="11" />M7<br>
<input name="option" type="radio" id="12" />P8<br> 
-->

<p id="insertAnswer"></p>
<!-- <button onclick="submit()">Submit</button><br><br> -->
<div id="nextButton"><button onclick="next()">Next</button></div>

<script>
  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4 *NOTE THE SPELLINGGGGGGGGGGGGGG 😎
  var answer = getRndInteger(1, 12 + 1); 
  var delay = 0; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;
  var playDuration = 0.75;
  var colorCorrect = "green";
  var colorWrong = "red";

  window.onload = function () {
    MIDI.loadPlugin({
      soundfontUrl: "./soundfont/",
      instrument: "acoustic_grand_piano",
      onprogress: function(state, progress) {
        console.log(state, progress);
      },
      onsuccess: function() {
        MIDI.noteOn(0, noteBass, velocity, delay);
        MIDI.noteOff(0, noteBass, delay + playDuration);

        MIDI.noteOn(0, noteBass + answer, velocity, delay + playDuration);
        MIDI.noteOff(0, noteBass + answer, delay + playDuration * 2);
      }
    });
  };

  function getRndInteger(min, max) {
    return Math.floor(Math.random() * (max - min)) + min;
  }

  function submit(clicked_id) {
    if (clicked_id == answer) {
      $("#insertAnswer").html("Correct!");    
      $("#nextButton").show(); 
      score++;
      $("#insertScore").html(score);
      //USE JQUERY
      document.getElementById(clicked_id).style.backgroundColor = colorCorrect;
      } else {
      $("#insertAnswer").html("Try again.")
      $("#nextButton").hide(); 
      document.getElementById(clicked_id).style.backgroundColor = colorWrong;
    }
  }

  function next() {
    noteBass = getRndInteger(startRange, endRange + 1); //C4-B4
    answer = getRndInteger(1, 12 + 1); 
    MIDI.noteOn(0, noteBass, velocity, delay);
    MIDI.noteOff(0, noteBass, delay + playDuration);

    MIDI.noteOn(0, noteBass + answer, velocity, delay + playDuration);
    MIDI.noteOff(0, noteBass + answer, delay + playDuration * 2);
    $("#insertAnswer").html("");
  }

  function playAgain() {
    MIDI.noteOn(0, noteBass, velocity, delay);
    MIDI.noteOff(0, noteBass, delay + playDuration);

    MIDI.noteOn(0, noteBass + answer, velocity, delay + playDuration);
    MIDI.noteOff(0, noteBass + answer, delay + playDuration * 2);  }

  $(document).ready(function(){
    $("#nextButton").hide();
    $("#nextButton").click(function(){
      $("#nextButton").hide(); 
    });
  });

</script>

</body>
</html>
