<title>Melodic Interval Training</title>
<h1>Melodic Interval Training</h1>

<p>Current score: <text id="insertScore"></text></p>
<button onclick="playAgain()">Click to hear interval</button><br><br>

<input class="ansChoice" type="button" onclick="submit(this.id)" id="1" value="m2" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="2" value="M2" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="3" value="m3" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="4" value="M3" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="5" value="P4" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="6" value="TT" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="7" value="P5" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="8" value="m6" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="9" value="M6" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="10" value="m7" />
<input class="ansChoice" type="button" onclick="submit(this.id)" id="11" value="M7" /><br>
<input class="ansChoice" type="button" onclick="submit(this.id)" id="12" value="P8" /><br>

<p></p>
<div id="nextButton"><button onclick="next()">Next</button></div>

<script src="base.js"></script>

<script>
  var startRange = 57; //57 = A4
  var endRange = 69; //69 = A5
  var noteBass = getRndInteger(startRange, endRange + 1); //C4-B4 *NOTE THE SPELLINGGGGGGGGGGGGGG 😎
  var answer = getRndInteger(1, 12 + 1); 

  var delay = 0; // play one note every quarter second
  var velocity = 90; // how hard the note hits
  var score = 0;
  var playDuration = 0.75;
  var colorCorrect = "green";
  var colorWrong = "red";

  function submit(clicked_id) {
    if (clicked_id == answer) {   
      $("#nextButton").show(); 
      score++;
      $("#insertScore").html(score);
      $("body").find('#' + clicked_id).addClass("rightButton");
      $(".ansChoice").prop('disabled', true);
      } else {
      $("#nextButton").hide(); 
      $("body").find('#' + clicked_id).addClass("wrongButton");
      $("body").find('#' + clicked_id).prop('disabled', true);
    }
  }

  function next() {
    noteBass = getRndInteger(startRange, endRange + 1); //C4-B4
    answer = getRndInteger(1, 12 + 1);
    setTimeout(function() {playAgain() }, 1000);
    $(".ansChoice").removeClass("wrongButton");
    $(".ansChoice").removeClass("rightButton");
    $(".ansChoice").prop('disabled', false);
  }

  function playAgain() {
    MIDI.noteOn(0, noteBass, velocity, delay);
    MIDI.noteOff(0, noteBass, delay + playDuration);

    MIDI.noteOn(0, noteBass + answer, velocity, delay + playDuration);
    MIDI.noteOff(0, noteBass + answer, delay + playDuration * 2);  
  }
</script>

</body>
</html>
